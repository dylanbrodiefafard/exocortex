<!doctype html>
<html lang="{{ site.language }}">
<head><title>{{ tag.name }} | {{ site.title }}</title></head>
<body>
{% include "partials/header.html" %}
<h1>Tagged {{ tag.name }}</h1>
<ul>
{% for post in tag.posts %}<li><a href="{{ post.url }}">{{ post.title }}</a> ({{ post.date | isodate }})</li>
{% endfor %}</ul>
</body>
</html>
